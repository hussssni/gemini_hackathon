<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Breadcrumb</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <h1>Breadcrumb</h1>
    <span id="status" class="status" data-tone="neutral">Ready</span>
  </header>

  <main>
    <label class="target" for="destination">
      <span class="target-label">I'm trying to find</span>
      <input id="destination" type="text" placeholder="a road, the car park, the main trail…"
             autocomplete="off" enterkeyhint="done" maxlength="200">
    </label>

    <p id="arrived" class="arrived" hidden></p>

    <section class="panes">
      <div class="pane pane-camera">
        <video id="preview" playsinline muted aria-hidden="true"></video>
        <div id="marker" class="marker" hidden>
          <span id="marker-ring" class="marker-ring"></span>
          <span id="marker-label" class="marker-label"></span>
        </div>
        <span class="pane-label">Camera</span>
      </div>
      <div class="pane pane-map">
        <canvas id="map" role="img" aria-label="Map: nothing mapped yet."></canvas>
        <span class="pane-label">Map</span>
      </div>
    </section>

    <ul class="legend" aria-label="Map key">
      <li><i class="key key-fork"></i>Fork</li>
      <li><i class="key key-chosen"></i>Going now</li>
      <li><i class="key key-walked"></i>Walked</li>
      <li><i class="key key-untried"></i>Untried</li>
      <li><i class="key key-failed"></i>Failed</li>
    </ul>

    <dl class="stats">
      <div><dt>Places</dt><dd id="places">0</dd></div>
      <div><dt>Forks</dt><dd id="forks">0</dd></div>
      <div><dt>Untried</dt><dd id="leads">0</dd></div>
    </dl>

    <section id="survey" class="survey" hidden>
      <div class="survey-head">
        <h2>Where you are</h2>
        <span id="survey-badge" class="badge" data-tone="neutral"></span>
      </div>
      <p id="survey-spoken" class="survey-spoken"></p>
      <p id="survey-here" class="survey-here"></p>
      <h3>Ways out of here</h3>
      <ul id="survey-options" class="options"></ul>
      <div class="survey-actions">
        <button id="replay" type="button" class="ghost">Say it again</button>
        <button id="reject" type="button" class="ghost danger-ghost" hidden>Not that way</button>
      </div>
    </section>

    <details class="dev">
      <summary>Desktop testing</summary>
      <p>No phone sensors? Set a heading and tap Step to fake walking between stops.</p>
      <label for="sim-heading">Heading</label>
      <input id="sim-heading" type="range" min="0" max="359" value="0">
      <button id="sim-step" type="button" class="ghost">Step</button>
    </details>
  </main>

  <footer class="actions">
    <button id="start" type="button" class="ghost">Camera on</button>
    <button id="look" type="button" class="primary">Look around</button>
    <button id="reset" type="button" class="ghost">Reset</button>
  </footer>

  <p id="toast" class="toast" role="alert" hidden></p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
